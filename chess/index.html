<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Chess vs AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Simple Chess</h1>
        <p>Play as White. The AI plays Black.</p>
      </header>
      <main>
        <section class="board-panel">
          <div id="board" class="board" aria-label="Chess board" role="grid"></div>
        </section>
        <aside class="info-panel">
          <div class="status">
            <h2>Status</h2>
            <p id="status">White to move.</p>
          </div>
          <div class="controls">
            <button id="restart">Restart Game</button>
          </div>
          <div class="legend">
            <h2>Legend</h2>
            <ul>
              <li><span class="legend-swatch selected"></span>Selected piece</li>
              <li><span class="legend-swatch move"></span>Available move</li>
              <li><span class="legend-swatch capture"></span>Capture</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>
    <script src="chess.js"></script>
  </body>
</html>
